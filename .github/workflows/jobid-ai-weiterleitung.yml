name: jobid.ai Weiterleitung (301)

# Legt auf dem IONOS-Webspace den Ordner /jobid-ai-weiterleitung mit einer
# .htaccess an, die jobid.ai Seite fuer Seite per 301 auf jobid.com leitet.
# IONOS-Domain-Weiterleitungen liefern nur 302; deshalb wird jobid.ai danach
# in IONOS per "Webspace verbinden" mit diesem Ordner verbunden.
# Beruehrt keinen anderen Ordner (absoluter Pfad ab Webspace-Wurzel).

on:
  push:
    branches: [main]
    paths:
      - ".github/jobid-ai-weiterleitung/**"
      - ".github/workflows/jobid-ai-weiterleitung.yml"
  workflow_dispatch:

concurrency:
  group: ionos-jobid-ai-weiterleitung
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: .htaccess nach /jobid-ai-weiterleitung hochladen
        env:
          SFTP_HOST: ${{ secrets.FTP_HOST }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
          set sftp:auto-confirm yes
          set net:max-retries 3
          set net:timeout 30
          open -u '$SFTP_USER','$SFTP_PASS' sftp://$SFTP_HOST
          cd /
          mkdir -f jobid-ai-weiterleitung
          cd jobid-ai-weiterleitung
          put .github/jobid-ai-weiterleitung/htaccess -o .htaccess
          cls -la
          "
